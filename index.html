<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Midway Manager</title>
<style>
:root{
  --bg:#0f1424; --panel:rgba(16,22,40,.92); --panel2:rgba(26,34,60,.95); --line:rgba(255,255,255,.10);
  --text:#eef1fb; --muted:#9aa4c4; --gold:#ffcc33; --red:#ff4d5e; --teal:#35d0c0; --green:#5ee08a; --blue:#5aa8ff; --orange:#ff9a3c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1c;color:var(--text);font-family:Roboto,"Segoe UI",system-ui,sans-serif;font-size:14px;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px}
button:hover{border-color:rgba(255,255,255,.3);background:#2a3560}
button.primary{background:var(--gold);color:#201600;border-color:var(--gold);font-weight:700}
button.primary:hover{background:#ffd95e}
button.danger{background:#5a1c27;border-color:#a8344a}
button.danger:hover{background:#7a2534}
button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;color:var(--text);background:#0c1120;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input[type=range]{padding:0;accent-color:var(--gold)}
input[type=color]{padding:0;width:38px;height:26px;border-radius:6px}
.hidden{display:none!important}
#view{position:fixed;inset:0}
#view canvas{display:block}

/* top bar */
#topbar{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none}
#topbar>*{pointer-events:auto}
.tb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;white-space:nowrap}
.tb b{color:var(--gold)}
#tbName{font-weight:800;letter-spacing:.3px}
.tb-speed{display:flex;gap:2px;padding:3px}
.tb-speed button{padding:4px 8px;border-radius:6px;background:transparent;border-color:transparent}
.tb-speed button.on{background:var(--gold);color:#201600}
#btnOpen{font-weight:800}
#btnOpen.isopen{background:#1d5a3a;border-color:var(--green)}
#btnOpen.isclosed{background:#5a1c27;border-color:var(--red)}
.spacer{flex:1}

/* left toolbar */
#toolbar{position:fixed;left:8px;top:60px;display:flex;flex-direction:column;gap:6px}
#toolbar button{width:62px;padding:7px 4px;font-size:11px;line-height:1.15;background:var(--panel);text-align:center}
#toolbar button .ic{display:block;font-size:19px;margin-bottom:2px}
#toolbar button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}

/* side panel */
#panel{position:fixed;left:78px;top:60px;bottom:118px;width:360px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
#panel .ph{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#panel .ph h3{margin:0;font-size:16px;flex:1}
#panel .pb{padding:10px 12px;overflow:auto;flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tabs button{padding:4px 8px;font-size:12px}
.tabs button.on{background:var(--gold);color:#201600;border-color:var(--gold)}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
.card:hover{border-color:rgba(255,204,51,.6)}
.card.sel{border-color:var(--gold);background:rgba(255,204,51,.08)}
.card .t{display:flex;justify-content:space-between;font-weight:700}
.card .d{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.35}
.bars{display:flex;gap:8px;margin-top:5px;font-size:11px;color:var(--muted)}
.bar{flex:1}
.bar i{display:block;height:5px;border-radius:3px;background:#273152;margin-top:2px;overflow:hidden}
.bar i b{display:block;height:100%}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:1;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.warn{color:var(--orange)}
.bad{color:var(--red)}
.good{color:var(--green)}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;background:#273152;margin-right:3px}
.meter{height:7px;background:#273152;border-radius:4px;overflow:hidden;margin-top:3px}
.meter b{display:block;height:100%}
table.sheet{width:100%;border-collapse:collapse;font-size:12px}
table.sheet td{padding:3px 2px;border-bottom:1px solid var(--line)}
table.sheet td:last-child{text-align:right}

/* inspector */
#inspector{position:fixed;right:8px;top:60px;width:330px;max-height:calc(100% - 180px);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;padding:10px 12px}
#inspector h3{margin:0 0 2px;font-size:16px}
#inspector .x{float:right;padding:2px 8px}
.thought{background:rgba(255,255,255,.05);border-radius:8px;padding:5px 8px;margin:4px 0;font-size:12.5px}

/* feed */
#feed{position:fixed;left:8px;bottom:40px;width:430px;max-height:150px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;pointer-events:none}
#feed .f{background:rgba(10,14,28,.78);border-radius:8px;padding:4px 8px;font-size:12.5px;pointer-events:auto;cursor:pointer;animation:fin .3s}
#feed .f b{color:var(--teal)}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* ticker */
#ticker{position:fixed;left:0;right:0;bottom:0;height:30px;background:rgba(8,10,20,.9);border-top:1px solid var(--line);display:flex;align-items:center;overflow:hidden;font-size:13px}
#ticker .lab{background:var(--red);color:#fff;font-weight:800;padding:0 10px;height:100%;display:flex;align-items:center;flex-shrink:0;z-index:2}
#tickerText{white-space:nowrap;padding-left:100%;animation:tick 40s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* toasts */
#toasts{position:fixed;top:60px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:20}
.toast{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;max-width:520px;text-align:center;animation:fin .3s;pointer-events:auto;cursor:pointer}
.toast.bad{border-color:var(--red);background:#3b1520}
.toast.good{border-color:var(--green)}
.toast.warn{border-color:var(--orange)}

/* hint */
#hint{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:6px 12px;font-size:13px}
#camBtns{position:fixed;right:8px;bottom:40px;display:flex;gap:4px}
#paused{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:rgba(255,204,51,.95);color:#201600;font-weight:800;border-radius:8px;padding:4px 12px;font-size:12px;z-index:12;pointer-events:none}
@media (max-width:700px){#paused{top:74px}}
#camBtns button{width:36px;height:34px;padding:0;background:var(--panel)}

/* tutorial */
#tutorial{position:fixed;right:8px;bottom:84px;width:340px;background:linear-gradient(160deg,#25305a,#151c34);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;z-index:15;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#tutorial h4{margin:0 0 6px;color:var(--gold);font-size:15px}
#tutorial p{margin:0 0 8px;line-height:1.45;font-size:13px}
#tutorial .tstep{color:var(--muted);font-size:11px;float:right}
.pulse{animation:pulse 1.2s infinite;border-color:var(--gold)!important}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,204,51,.7)}50%{box-shadow:0 0 0 6px rgba(255,204,51,0)}}

/* modal */
#modal{position:fixed;inset:0;background:rgba(5,8,18,.7);display:flex;align-items:center;justify-content:center;z-index:50}
.modal-box{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;width:min(620px,94vw);max-height:90vh;overflow:auto}
.modal-box h2{margin:0 0 10px}
.goalbox{border:1px solid var(--gold);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:rgba(255,204,51,.08)}
.card.locked{opacity:.45}
.featured-card{border-color:#ffcc33;background:linear-gradient(135deg,rgba(255,77,94,.16),rgba(255,204,51,.14));box-shadow:0 0 0 1px rgba(255,204,51,.35) inset}
.designer-card{display:block;width:100%;text-align:left;border-color:var(--gold);background:linear-gradient(135deg,rgba(255,204,51,.14),rgba(90,168,255,.1));color:var(--text);font:inherit}
.modal-box.designer{width:min(1000px,97vw);padding:14px 16px}
.dz-head{display:flex;justify-content:space-between;align-items:center}.dz-head h2{margin:0}
.dz-top{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.dz-top input{flex:1 1 140px;min-width:120px}.dz-top select{flex:0 1 auto;max-width:100%}
.dz-main{display:grid;grid-template-columns:1fr 250px;gap:10px;align-items:start}
.dz-view{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
#dzCan{display:block;width:100%;height:300px;touch-action:none;cursor:grab}
.dz-hud{position:absolute;left:8px;top:6px;font-size:13px;color:#fff;text-shadow:0 1px 3px #000}
.dz-hint{position:absolute;right:8px;bottom:5px;font-size:11px;color:var(--muted)}
.dz-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px}.dz-stats div{display:flex;flex-direction:column;background:rgba(255,255,255,.04);border-radius:6px;padding:4px 7px}.dz-stats span{color:var(--muted);font-size:11px}.dz-stats b{font-size:14px}.dz-stats em{font-style:normal}
.dz-warn{margin:8px 0;padding:7px 10px;border-radius:8px;background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.4);font-size:12.5px;line-height:1.45}
.dz-ok{margin:8px 0;padding:7px 10px;border-radius:8px;background:rgba(94,224,138,.1);border:1px solid rgba(94,224,138,.35);font-size:12.5px;color:var(--green)}
.dz-label{font-weight:700;margin:8px 0 4px;font-size:13px}
.dz-seq{display:flex;flex-wrap:wrap;gap:4px;max-height:96px;overflow:auto}
.chip{font-size:11.5px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--text)}
.chip.st{background:rgba(90,168,255,.18);border-color:rgba(90,168,255,.5)}
button.chip:hover{background:rgba(255,77,94,.25);border-color:var(--red)}
.dz-pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px}
.dz-pal button{font-size:11.5px;padding:6px 6px;text-align:left;display:flex;gap:6px;align-items:center;line-height:1.15}.dz-pal i{font-style:normal;font-size:15px;width:18px;text-align:center;color:var(--gold)}
.dz-actions{margin-top:10px}
@media (max-width:700px){.dz-main{grid-template-columns:1fr}#dzCan{height:220px}.dz-stats{grid-template-columns:repeat(3,1fr)}.dz-pal{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}}
@media (max-height:500px) and (min-width:701px){#dzCan{height:190px}.dz-main{grid-template-columns:1fr 220px}}

.factor{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.factor .ic{width:20px;text-align:center;font-weight:800}

/* main menu */
#menu{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 120%,#3a1d4f 0%,#141a33 55%,#0a0d1a 100%);display:flex;align-items:center;justify-content:center;overflow:auto}
.menu-wrap{width:min(820px,94vw);padding:20px 0}
.logo{text-align:center;margin-bottom:18px}
.logo h1{margin:0;font-size:52px;letter-spacing:2px;font-weight:900;background:linear-gradient(90deg,#ff4d5e,#ffcc33,#35d0c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo div{color:var(--muted)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.slot .num{font-size:22px;font-weight:900;color:var(--gold);width:28px;text-align:center}
.slot .info{flex:1;min-width:0}
.slot .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .info span{color:var(--muted);font-size:12px}
.slot .acts{display:flex;gap:4px}
.ptypes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.ptype{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;font-size:12px}
.ptype b{display:block;font-size:13px;margin-bottom:2px}
.ptype.sel{border-color:var(--gold);background:rgba(255,204,51,.1)}
.ptype.locked{opacity:.45;cursor:not-allowed}
#loading{position:fixed;inset:0;z-index:60;background:#0a0d1a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:16px;text-align:center;padding:20px}

/* minigame */
#mini{position:relative;width:100%;height:300px;background:#0a0f1d;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.bolt{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ddd,#666);border:3px solid #333;display:flex;align-items:center;justify-content:center;font-weight:900;color:#111;cursor:pointer}
.bolt.done{background:var(--green);border-color:#2a7}
@media (max-width:900px){#panel{width:300px}#inspector{width:290px}#feed{width:300px}}

/* ---- touch: never let the page scroll or zoom; only panels scroll ---- */
html,body{position:fixed;inset:0;overscroll-behavior:none;touch-action:none}
#view,#view canvas{touch-action:none}
#panel .pb,#inspector,.modal-box,#menu,#tutorial{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#topbar{touch-action:pan-x}

/* ---- phone portrait ---- */
@media (max-width:700px){
  body{font-size:13px}
  #topbar{top:4px;left:4px;right:4px;gap:4px;justify-content:center}
  #topbar>.tb:first-child{display:none}
  .tb{padding:4px 7px;font-size:12px}
  .tb-speed button{padding:3px 5px}
  .mlab{display:none}
  #btnOpen,#btnMenu{padding:5px 8px;font-size:12px;flex-shrink:0}
  .spacer{display:none}
  #toolbar{top:auto;bottom:28px;left:0;right:0;flex-direction:row;gap:2px;padding:4px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
  #toolbar button{flex:1;width:auto;min-width:44px;padding:5px 2px;font-size:10px;border:0;background:transparent}
  #toolbar button .ic{font-size:17px;margin:0}
  #panel,#inspector{left:0;right:0;top:auto;bottom:86px;width:auto;border-radius:14px 14px 0 0}
  #panel{height:52vh}
  #inspector{max-height:52vh}
  #feed{left:6px;bottom:92px;width:calc(100% - 60px);max-height:58px}
  #feed .f{font-size:11.5px;padding:3px 7px}
  #feed .f:nth-last-child(n+3){display:none}
  body.sheet-open #feed,body.sheet-open #camBtns{display:none}
  #camBtns{bottom:92px;right:4px;flex-direction:column}
  #camBtns button{width:34px;height:32px}
  #hint{bottom:92px;width:92%;font-size:12px;text-align:center}
  #ticker{height:26px;font-size:12px}
  #toasts{top:78px;width:94%}
  .toast{font-size:12.5px;padding:6px 10px}
  #tutorial{left:6px;right:6px;width:auto;top:76px;bottom:auto;max-height:34vh;overflow:auto;padding:9px 11px}
  #tutorial p{font-size:12.5px}
  .modal-box{padding:12px 14px;width:96vw}
  .slots{grid-template-columns:1fr}
  .ptypes{grid-template-columns:1fr 1fr}
  .logo h1{font-size:34px}
}

/* ---- phone landscape ---- */
@media (max-height:500px) and (min-width:701px){
  body{font-size:12.5px}
  #topbar{top:4px;left:4px;right:4px;flex-wrap:nowrap;overflow-x:auto;gap:4px;scrollbar-width:none}
  #topbar::-webkit-scrollbar{display:none}
  #topbar>.tb:first-child{display:none}
  .tb{padding:3px 6px;font-size:11.5px}
  .tb-speed button{padding:2px 6px}
  #btnOpen,#btnMenu{padding:4px 8px;font-size:12px;flex-shrink:0}
  .spacer{display:none}
  #toolbar{top:38px;left:4px;bottom:28px;gap:2px;overflow-y:auto}
  #toolbar button{width:50px;padding:2px;font-size:9px}
  #toolbar button .ic{font-size:14px;margin:0}
  .mlab{display:none}
  #panel{left:60px;top:40px;bottom:30px;width:300px}
  #inspector{top:40px;right:4px;width:270px;max-height:calc(100% - 74px)}
  #feed{left:60px;bottom:30px;width:260px;max-height:46px}
  #feed .f{font-size:11px;padding:2px 6px}
  #feed .f:nth-last-child(n+3){display:none}
  body.panel-open #feed{display:none}
  #camBtns{bottom:30px;right:4px}
  body.insp-open #camBtns{display:none}
  #camBtns button{width:32px;height:30px}
  #hint{bottom:30px;font-size:12px}
  #ticker{height:24px;font-size:11.5px}
  #toasts{top:40px}
  #tutorial{right:4px;bottom:66px;width:270px;max-height:58vh;overflow:auto;padding:8px 10px}
  #tutorial p{font-size:12px;margin-bottom:5px}
  #tutorial h4{font-size:13.5px}
  body.insp-open #tutorial{display:none}
  .modal-box{padding:10px 14px;max-height:94vh}
  .slots{grid-template-columns:1fr 1fr}
  .logo h1{font-size:30px}
  .logo{margin-bottom:8px}
}
</style>
</head>
<body>
<div id="view"></div>

<div id="hud" class="hidden">
  <div id="topbar">
    <div class="tb"><span id="tbName">Park</span></div>
    <div class="tb" id="tbMoney"></div>
    <div class="tb" id="tbTime"></div>
    <div class="tb" id="tbWeather"></div>
    <div class="tb" id="tbGuests"></div>
    <div class="tb" id="tbRating"></div>
    <div class="tb tb-speed" id="speedBtns">
      <button data-speed="0" title="Pause (Space)">&#10074;&#10074;</button>
      <button data-speed="1" title="Normal (1)">&#9654;</button>
      <button data-speed="2" title="Fast (2)">&#9654;&#9654;</button>
      <button data-speed="4" title="Fastest (3)">&#9654;&#9654;&#9654;</button>
    </div>
    <div class="spacer"></div>
    <button id="btnOpen" class="isclosed">PARK CLOSED</button>
    <button id="btnMenu" class="tb">&#9776;<span class="mlab"> Menu</span></button>
  </div>
  <div id="toolbar">
    <button data-panel="build"><span class="ic">&#127906;</span>Build</button>
    <button data-tool="path"><span class="ic">&#9638;</span>Paths</button>
    <button data-tool="bulldoze"><span class="ic">&#128679;</span>Remove</button>
    <button data-tool="land"><span class="ic">&#127969;</span>Land</button>
    <button data-panel="staff"><span class="ic">&#128119;</span>Staff</button>
    <button data-panel="park"><span class="ic">&#128176;</span>Park</button>
    <button data-panel="planner"><span class="ic">&#128161;</span>Ideas</button>
    <button data-panel="safety"><span class="ic">&#9888;</span>Safety</button>
    <button data-panel="map"><span class="ic">&#127758;</span>Map</button>
  </div>
  <div id="panel" class="hidden"><div class="ph"><h3 id="panelTitle"></h3><button id="panelClose">&#10005;</button></div><div class="pb" id="panelBody"></div></div>
  <div id="inspector" class="hidden"></div>
  <div id="feed"></div>
  <div id="toasts"></div>
  <div id="hint" class="hidden"></div>
  <div id="paused" class="hidden">PAUSED &middot; press Space or &#9654; to resume</div>
  <div id="camBtns">
    <button data-cam="rl" title="Rotate left (Q)">&#10226;</button>
    <button data-cam="rr" title="Rotate right (E)">&#10227;</button>
    <button data-cam="zi" title="Zoom in">+</button>
    <button data-cam="zo" title="Zoom out">&minus;</button>
    <button data-cam="home" title="Back to park">&#8962;</button>
  </div>
  <div id="tutorial" class="hidden"></div>
  <div id="ticker"><div class="lab">NEWS</div><div id="tickerText">Welcome to Midway Manager.</div></div>
</div>

<div id="modal" class="hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="menu" class="hidden"></div>
<div id="loading"><div style="font-size:28px;font-weight:900;color:#ffcc33">MIDWAY MANAGER</div><div id="loadMsg">Loading 3D engine&hellip;</div></div>
<script>
"use strict";
function GAME(){
// ===================== UTIL =====================
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = () => Math.random();
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;

let AC = null;

function sfx(kind) {

    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination);

    else if (kind === 'build') { o.type = 'square'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(440, t + 0.12); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.start(t); o.stop(t + 0.18); }
    else if (kind === 'cash') { o.type = 'triangle'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + 0.06); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.start(t); o.stop(t + 0.2); }
    else if (kind === 'siren') { o.type = 'sawtooth'; for (let i = 0; i < 4; i++) { o.frequency.setValueAtTime(700, t + i * 0.5); o.frequency.linearRampToValueAtTime(1000, t + i * 0.5 + 0.25); o.frequency.linearRampToValueAtTime(700, t + i * 0.5 + 0.5); } g.gain.setValueAtTime(0.025, t); g.gain.linearRampToValueAtTime(0.0001, t + 2); o.start(t); o.stop(t + 2); }
    else if (kind === 'alert') { o.type = 'square'; o.frequency.setValueAtTime(520, t); o.frequency.setValueAtTime(390, t + 0.15); o.frequency.setValueAtTime(520, t + 0.3); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5); o.start(t); o.stop(t + 0.5); }
    else if (kind === 'boom') { const b = AC.createBuffer(1, AC.sampleRate * 0.7, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); const src = AC.createBufferSource(), f = AC.createBiquadFilter(), gg = AC.createGain(); f.type = 'lowpass'; f.frequency.value = 500; gg.gain.value = 0.18; src.buffer = b; src.connect(f); f.connect(gg); gg.connect(AC.destination); src.start(t); }
    else if (kind === 'thunder') { const b = AC.createBuffer(1, AC.sampleRate * 1.6, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2); const s = AC.createBufferSource(); s.buffer = b; const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300; s.connect(f); f.connect(g); g.gain.setValueAtTime(0.35, t); s.start(t); o.disconnect(); }

    stats.phys = { dollsMax: stats.dollsMax, crewMax: stats.crewMax, wreck: rides.filter(r => r.wrecked).map(r => r.name), injuredNow: guests.filter(g => g.state === 'injured').length, flungNow: guests.filter(g => g.state === 'flung').length };

    for (const k of ['junior', 'mine', 'flyer', 'flume', 'dark']) { const C = buildCoasterPath(k); const fr = { state: 'running', stuck: false, riders: [], co: { C, cars: [], s: C.stop, v: 0, g: { userData: {} }, splashT: -1, valley: false, done: false } }; let n = 0, vmax = 0, splash = 0; while (!fr.co.done && n < 20000) { coasterAnimate(fr, 0.05, 1); vmax = Math.max(vmax, fr.co.v); if (fr.co.splashT === 0) splash++; n++; } stats.coasters[k] = { secs: Math.round(n * 0.05), L: Math.round(C.L), vmax: +vmax.toFixed(1), done: fr.co.done, splash }; }
    for (const k in RIDE_DEFS) { const d = RIDE_DEFS[k]; if (d.coaster !== 'track') continue; const C = trackFor(d), S = simulateTrack(C, d.style); stats.coasters[k] = { secs: S.secs, L: Math.round(C.L), vmax: +S.vmax.toFixed(1), done: S.done, G: +S.maxG.toFixed(2), negG: +S.minG.toFixed(2), lat: +S.maxLat.toFixed(2), inv: S.inv, plot: C.w + 'x' + C.h, clash: trackClashes(C).length, exc: d.exc, int: d.int, nau: d.nau, cap: d.cap, seats: (B_SEATS[k] || (rides.find(r => r.type === k) || { mesh: { seats: [] } }).mesh.seats.length) }; }
    const ser = JSON.stringify(serialize()); stats.saveBytes = ser.length;
    stats.ms = Math.round(performance.now() - t0);
    out.stats = stats;
  } catch (e) { out.errors.push('FATAL ' + e.message + '\n' + e.stack); }
  const pre = document.createElement('pre'); pre.id = 'testout'; pre.textContent = JSON.stringify(out, null, 1); document.body.appendChild(pre);
  document.title = 'SELFTEST DONE';
}

// ===================== UI TEST (open index.html?uitest) =====================
function runUITest() {
  const out = { errors: [], steps: [] };
  window.onerror = (m, s, l, c) => { out.errors.push(m + ' @' + l + ':' + c); };
  const q = s => document.querySelector(s);
  const click = s => { const e = q(s); if (!e) { out.errors.push('missing ' + s); return false; } e.click(); out.steps.push('click ' + s); return true; };
  const change = (s, v) => { const e = q(s); if (!e) { out.errors.push('missing ' + s); return; } e.value = v; e.dispatchEvent(new Event('change', { bubbles: true })); out.steps.push('change ' + s); };
  const done = () => { const pre = document.createElement('pre'); pre.id = 'testout'; pre.textContent = JSON.stringify(out, null, 1); document.body.appendChild(pre); document.title = 'UITEST DONE'; };
  try {
    try { for (let i = 0; i < 10; i++) localStorage.removeItem(SLOT_KEY(i)); } catch (e) { }
    showMainMenu(); out.slotsRendered = document.querySelectorAll('.slot').length;
    click('[data-act=slotnew][data-slot="0"]'); change('#npName', 'UI Test Land'); click('[data-act=slotcreate]');
    setTimeout(() => {
      try {
        out.started = !!GS && GS.name; out.tut0 = GS.tut;
        click('[data-tut=next]');
        UI.camMoved = 100; tutorialTick();
        click('[data-panel=staff]'); click('[data-stab=gate]'); click('[data-hire=gate]'); tutorialTick();
        click('[data-tool=path]'); for (let x = 31; x <= 36; x++) paintPath({ x: tcx(x), z: tcz(39) }); click('[data-tool=path]'); tutorialTick();
        click('[data-panel=build]'); click('[data-tab=gentle]'); click('[data-build="ride:carousel"]'); UI.rot = 0; tryPlace({ x: tcx(20), z: tcz(37) }); tutorialTick();
        out.rides = rides.map(r => r.name);
        click('[data-panel=staff]'); for (const r of ['operator', 'maintenance', 'cashier', 'janitor', 'trainer', 'planner', 'security']) { UI.stab = r; renderPanel(true); click('[data-hire=' + r + ']'); tutorialTick(); }
        click('[data-panel=build]'); click('[data-tab=food]'); click('[data-build="stand:snack"]'); UI.rot = 0; tryPlace({ x: tcx(28), z: tcz(38) }); tutorialTick();
        out.stands = stands.map(s => s.name);
        UI.stab = 'operator'; openPanel('staff'); click('[data-train]'); tutorialTick();
        click('#btnOpen'); tutorialTick();
        out.tutAfterOpen = GS.tut;
        click('[data-tut=next]');
        select(rides[0]); change('[data-rset=name]', 'Golden Gallop'); change('[data-rset=c1]', '#00ff88'); change('[data-rset=speed]', '1.2'); change('[data-rset=cycles]', '2'); tutorialTick();
        out.rideCustom = { name: rides[0].name, c1: rides[0].c1, speed: rides[0].speed, cycles: rides[0].cycles };
        select(stands[0]); change('[data-mprice="0"]', '9'); change('[data-mq="0"]', 'premium'); click('[data-act=additem]');
        out.menu = stands[0].menu.map(m => m.key + ':' + m.price + ':' + m.q);
        for (const p of ['park', 'planner', 'safety']) { click('[data-panel=' + p + ']'); }
        change('#admIn', '30'); out.adm = GS.admission;
        click('[data-panel=map]'); click('[data-panel=map]');
        for (let i = 0; i < 3000; i++) simStep(0.1);
        out.guestsInPark = guests.length; out.minute = timeStr(GS.minute);
        const g = guests.find(x => x.state === 'walk'); if (g) { select(g); tutorialTick(); out.guestThoughts = g.thoughts.length; }
        out.tutEnd = GS.tut;
        click('#btnMenu'); click('[data-act=slotquick]'); click('[data-act=slotsaveas][data-slot="3"]'); click('[data-act=closemodal]');
        out.slots = listSlots().map(s => s ? s.name + '/d' + s.day : null);
        const d = loadSlotData(0); out.saveHasRide = d && d.b.some(b => b.name === 'Golden Gallop');
        out.feedItems = document.querySelectorAll('#feed .f').length; out.toasts = document.querySelectorAll('.toast').length;
      } catch (e) { out.errors.push('FATAL ' + e.message + '\n' + e.stack); }
      done();
    }, 200);
  } catch (e) { out.errors.push('FATAL ' + e.message + '\n' + e.stack); done(); }
}

boot();
}

  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', next); else next();
})();
