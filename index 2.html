<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BOXMOD — Physics Sandbox</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Tahoma,Verdana,Segoe UI,sans-serif;color:#eee;user-select:none}
#game canvas{display:block}
.hidden{display:none!important}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#ffdc5a;box-shadow:0 0 2px #000}
#crosshair:before{left:10px;top:2px;width:2px;height:18px;clip-path:polygon(0 0,100% 0,100% 30%,0 30%,0 70%,100% 70%,100% 100%,0 100%)}
#crosshair:after{top:10px;left:2px;height:2px;width:18px;clip-path:polygon(0 0,30% 0,30% 100%,0 100%,0 0,70% 0,100% 0,100% 100%,70% 100%)}
.hudbox{position:absolute;background:rgba(0,0,0,.35);border-radius:10px;padding:6px 16px;color:#ffd24a;text-shadow:0 0 6px rgba(255,190,40,.6)}
.hudbox small{font-size:13px;letter-spacing:2px;opacity:.85;margin-right:10px}
.hudbox b{font-size:40px;font-weight:700;vertical-align:middle}
#hpbox{left:24px;bottom:24px}
#armorbox{left:190px;bottom:24px}
#ammobox{right:24px;bottom:24px;text-align:right}
#ammobox .res{font-size:22px;margin-left:8px}
#hpbox.low{color:#ff4030;text-shadow:0 0 8px #f00}
#wname{position:absolute;right:28px;bottom:92px;font-size:14px;color:#ffd24a;opacity:.85;text-shadow:0 0 4px #000}
#killfeed{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
#killfeed div{background:rgba(0,0,0,.55);padding:4px 10px;border-radius:4px;font-size:13px}
#killfeed .k{color:#ffb347}#killfeed .v{color:#7fd0ff}
#notify{position:absolute;right:16px;bottom:120px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
#notify div{background:rgba(30,30,30,.85);border-left:4px solid #4ea6ff;padding:5px 12px;font-size:13px;color:#fff;animation:sl .25s}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
#hint{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:15px;color:#fff;text-shadow:0 0 4px #000,0 0 2px #000}
#toolinfo{position:absolute;left:16px;top:16px;background:rgba(20,20,20,.75);border:1px solid #555;padding:8px 12px;max-width:300px;font-size:12px}
#toolinfo h3{margin:0 0 4px;font-size:16px;color:#7fc4ff}
#subtitles{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);text-align:center;font-size:18px;text-shadow:0 0 4px #000,0 0 4px #000;max-width:70%}
#subtitles div{margin:3px 0}
#centerMsg{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:34px;font-weight:bold;color:#fff;text-shadow:0 0 10px #000;text-align:center;letter-spacing:2px}
#wslots{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:6px}
#wslots .slot{background:rgba(0,0,0,.5);border:1px solid #333;min-width:110px;padding:4px;font-size:11px;color:#ffd24a}
#wslots .slot div{padding:3px 5px}
#wslots .slot .on{background:rgba(255,200,60,.3);color:#fff}
#wslots .num{font-weight:bold;color:#fff;padding:0 4px}
#blinkbar{position:absolute;left:24px;bottom:100px;width:160px;height:10px;border:1px solid #fff8;background:#0006}
#blinkbar div{height:100%;background:#fff;width:100%}
#blinkbar span{position:absolute;top:-16px;left:0;font-size:11px;letter-spacing:2px}
#waveinfo{position:absolute;left:50%;top:60px;transform:translateX(-50%);font-size:20px;color:#ff6b4a;text-shadow:0 0 6px #000;font-weight:bold}
#fx-damage{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,.7));opacity:0;transition:opacity .25s}
#fx-black{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0}
#fx-flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#fx-nv{position:fixed;inset:0;pointer-events:none;background:rgba(40,255,80,.22);mix-blend-mode:screen;opacity:0}
#fx-vhs{position:fixed;inset:0;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#fx-vhs:after{content:"PLAY ▶  " attr(data-t);position:absolute;left:30px;top:24px;font-family:monospace;font-size:26px;color:#fff;text-shadow:2px 0 #f0f,-2px 0 #0ff}
#fx-eas{position:fixed;left:0;right:0;top:0;padding:16px;background:#c00;color:#fff;font-family:monospace;font-size:20px;text-align:center;white-space:nowrap;overflow:hidden;opacity:0;pointer-events:none}
#fx-vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
/* Panels */
.panel{background:#2b2b2b;border:1px solid #111;box-shadow:0 8px 40px rgba(0,0,0,.7)}
.btn{background:linear-gradient(#5a5a5a,#3c3c3c);border:1px solid #1a1a1a;color:#fff;padding:7px 14px;cursor:pointer;font-family:inherit;font-size:13px;border-radius:3px}
.btn:hover{background:linear-gradient(#6aa8ff,#2f6ed1)}
.btn.blue{background:linear-gradient(#4f9cff,#225fc0)}
.btn.red{background:linear-gradient(#e0574a,#9a2a20)}
#spawnmenu{position:fixed;left:3%;top:4%;right:3%;bottom:4%;display:flex;flex-direction:column;z-index:20}
#smTabs{display:flex;background:#1d1d1d;padding:6px 6px 0;gap:2px;flex-wrap:wrap}
#smTabs .tab{padding:8px 14px;background:#3a3a3a;cursor:pointer;font-size:13px;border-radius:4px 4px 0 0}
#smTabs .tab.on{background:#4a90e2}
#smTabs .sp{flex:1}
#smBody{flex:1;display:flex;min-height:0}
#smSide{width:220px;background:#232323;overflow:auto;border-right:1px solid #111}
#smSide div{padding:7px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #2c2c2c}
#smSide div.on{background:#3b6fb5}
#smSide div:hover{background:#333}
#smSide h4{margin:10px 10px 4px;font-size:11px;color:#999;letter-spacing:1px;text-transform:uppercase}
#smMain{flex:1;overflow:auto;padding:12px;background:#2e2e2e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.icon{background:#3d3d3d;border:1px solid #222;border-radius:4px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center;font-size:11px;padding:4px;position:relative}
.icon:hover{background:#4a6f9c;border-color:#8bc0ff}
.icon canvas{width:72px;height:72px;margin-bottom:4px}
.icon .em{font-size:34px;margin-bottom:6px}
.icon .tag{position:absolute;top:3px;right:4px;font-size:9px;color:#9cf;opacity:.8}
.modcard{display:flex;gap:12px;background:#383838;border:1px solid #222;border-radius:5px;padding:10px;margin-bottom:8px;align-items:center}
.modcard .mi{font-size:34px;width:50px;text-align:center}
.modcard .md{flex:1}
.modcard h3{margin:0 0 3px;font-size:15px}
.modcard p{margin:0;font-size:12px;color:#bbb}
.modcard .meta{font-size:11px;color:#8ab;margin-top:3px}
.switch{width:52px;height:26px;border-radius:13px;background:#555;position:relative;cursor:pointer;flex:none;border:1px solid #111}
.switch:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#ddd;transition:.15s}
.switch.on{background:#3fae4f}.switch.on:after{left:29px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.row label{width:200px}
input[type=range]{width:220px}
select,input[type=text]{background:#1c1c1c;color:#eee;border:1px solid #555;padding:5px}
.lore{background:#222;border-left:3px solid #c33;padding:8px 12px;margin:6px 0 12px;font-size:12px;color:#ccc;line-height:1.5}
/* Main menu */
#mainmenu{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;padding-left:7%;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.2) 60%,transparent)}
#mainmenu h1{font-size:76px;margin:0;letter-spacing:6px;color:#fff;text-shadow:0 4px 20px #000;font-family:Impact,Arial Black,sans-serif}
#mainmenu h1 span{color:#4ea6ff}
#mainmenu .sub{color:#aaa;margin:0 0 30px 4px;letter-spacing:3px}
#mainmenu .mmbtn{font-size:24px;color:#ddd;padding:6px 0;cursor:pointer;width:max-content;text-shadow:0 2px 6px #000}
#mainmenu .mmbtn:hover{color:#4ea6ff;transform:translateX(6px)}
#mmPanel{position:fixed;right:5%;top:8%;bottom:8%;width:min(720px,52%);z-index:31;display:flex;flex-direction:column}
#mmPanel .hd{padding:10px 14px;background:#1d1d1d;display:flex;justify-content:space-between;align-items:center;font-size:16px}
#mmPanel .bd{flex:1;overflow:auto;padding:12px}
.mapcard{display:inline-block;width:200px;margin:6px;vertical-align:top;cursor:pointer;background:#383838;border:1px solid #222;border-radius:4px;overflow:hidden}
.mapcard:hover{border-color:#8bc0ff}
.mapcard .pv{height:100px;display:flex;align-items:center;justify-content:center;font-size:40px}
.mapcard .nm{padding:6px 8px;font-size:13px;font-weight:bold}
.mapcard .ds{padding:0 8px 8px;font-size:11px;color:#aaa}
#pause{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#pause h2{font-size:40px;margin:0 0 10px;letter-spacing:4px}
#pause .btn{width:260px;font-size:16px;padding:10px}
#clickplay{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:24;background:rgba(0,0,0,.7);padding:20px 30px;border-radius:8px;font-size:18px;cursor:pointer}
#loading{position:fixed;inset:0;z-index:100;background:#111;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:18px;gap:10px}
#deathscreen{position:fixed;inset:0;z-index:15;background:rgba(120,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;text-shadow:0 0 10px #000;pointer-events:none}
#deathscreen small{font-size:16px;margin-top:10px}
kbd{background:#444;border:1px solid #222;border-radius:3px;padding:1px 6px;font-family:inherit;font-size:12px}
.ctrls td{padding:3px 12px 3px 0;font-size:13px}
</style>
</head>
<body>
<div id="loading"><div>Loading BOXMOD…</div><div id="loadErr" style="color:#f77;max-width:520px;text-align:center;font-size:14px"></div></div>
<div id="game"></div>
<div id="fx-vignette"></div>
<div id="fx-nv"></div>
<div id="fx-vhs" data-t="SP 0:00:00"></div>
<div id="fx-damage"></div>
<div id="fx-black"></div>
<div id="fx-flash"></div>
<div id="fx-eas"></div>
<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="hpbox" class="hudbox"><small>HEALTH</small><b id="hpv">100</b></div>
  <div id="armorbox" class="hudbox hidden"><small>SUIT</small><b id="arv">0</b></div>
  <div id="ammobox" class="hudbox hidden"><small>AMMO</small><b id="clipv">0</b><span class="res" id="resv">0</span></div>
  <div id="wname"></div>
  <div id="killfeed"></div>
  <div id="notify"></div>
  <div id="hint"></div>
  <div id="toolinfo" class="hidden"></div>
  <div id="subtitles"></div>
  <div id="centerMsg"></div>
  <div id="wslots" class="hidden"></div>
  <div id="blinkbar" class="hidden"><span>BLINK</span><div></div></div>
  <div id="waveinfo"></div>
</div>
<div id="deathscreen" class="hidden"><div>YOU DIED</div><small id="deathby"></small><small>Click or press any key to respawn</small></div>
<div id="spawnmenu" class="panel hidden">
  <div id="smTabs"></div>
  <div id="smBody"><div id="smSide"></div><div id="smMain"></div></div>
</div>
<div id="mainmenu" class="hidden">
  <h1>BOX<span>MOD</span></h1>
  <div class="sub">PHYSICS SANDBOX · v1.0</div>
  <div class="mmbtn" data-act="play">Start New Game</div>
  <div class="mmbtn" data-act="resume" id="mmResume" style="display:none">Resume Game</div>
  <div class="mmbtn" data-act="mods">Mods</div>
  <div class="mmbtn" data-act="settings">Options</div>
  <div class="mmbtn" data-act="controls">Controls</div>
  <div class="mmbtn" data-act="credits">Credits</div>
</div>
<div id="mmPanel" class="panel hidden"><div class="hd"><span id="mmTitle"></span><button class="btn" id="mmClose">✕</button></div><div class="bd" id="mmBody"></div></div>
<div id="pause" class="hidden">
  <h2>PAUSED</h2>
  <button class="btn blue" data-p="resume">Resume</button>
  <button class="btn" data-p="spawn">Spawn Menu (Q)</button>
  <button class="btn" data-p="save">Save World</button>
  <button class="btn" data-p="load">Load World</button>
  <button class="btn" data-p="cleanup">Clean Up Map</button>
  <button class="btn" data-p="menu">Main Menu</button>
</div>
<div id="clickplay" class="hidden">Click to play</div>
<script>
setTimeout(function(){ if(!window.__bmStarted){ document.getElementById('loadErr').innerHTML='Could not load the 3D engine (three.js).<br>BOXMOD needs an internet connection the first time it opens (it loads three.js from cdn.jsdelivr.net). If your network blocks that site, try another network.'; } }, 9000);
window.addEventListener('error', function(e){ var el=document.getElementById('loadErr'); if(el && !window.__bmStarted) el.textContent='Error: '+e.message; });
</script>
<script type="module">
let THREE;
try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'); }
catch (e) { THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js'); }
window.__bmStarted = true;
// =====================================================================
//  BOXMOD — core engine
// =====================================================================
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V3(0, 1, 0);
const _v1 = V3(), _v2 = V3(), _v3 = V3(), _v4 = V3();
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion();
const _m4 = new THREE.Matrix4();
const _box = new THREE.Box3();
const _ray = new THREE.Ray();
const raycaster = new THREE.Raycaster();

function loadLS(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ? Object.assign(d, v) : d; } catch (e) { return d; } }
function saveLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

const Settings = loadLS('boxmod_settings', {
  quality: 'medium', sens: 1, fov: 80, infiniteAmmo: true, corpseTime: 45, volume: 0.6,
  npcLimit: 60, propLimit: 250, gore: true, viewbob: true, subtitles: true
});
function saveSettings() { saveLS('boxmod_settings', Settings); }

// ---------------- renderer / scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: Settings.quality !== 'low', powerPreference: 'high-performance' });
function applyQuality() {
  const q = Settings.quality;
  renderer.setPixelRatio(q === 'low' ? 0.75 : q === 'medium' ? Math.min(devicePixelRatio, 1) : Math.min(devicePixelRatio, 1.75));
  renderer.shadowMap.enabled = q !== 'low';
  if (sun) { sun.shadow.mapSize.set(q === 'high' ? 4096 : 2048, q === 'high' ? 4096 : 2048); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
  scene.traverse(o => { if (o.material) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => m.needsUpdate = true); } });
}
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
$('game').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(Settings.fov, innerWidth / innerHeight, 0.05, 4000);
camera.rotation.order = 'YXZ';
scene.add(camera);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x5a5040, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -70; sun.shadow.camera.right = 70; sun.shadow.camera.top = 70; sun.shadow.camera.bottom = -70;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 400;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);
const sunDir = V3(0.4, 0.8, 0.3).normalize();
// flashlight
const flashlight = new THREE.SpotLight(0xfff4e0, 0, 60, 0.42, 0.45, 1.2);
flashlight.position.set(0.25, -0.1, 0);
camera.add(flashlight); camera.add(flashlight.target); flashlight.target.position.set(0.1, -0.1, -5);
// pooled point lights (fixed count => no shader recompiles)
const LIGHT_POOL = Settings.quality === 'low' ? 5 : Settings.quality === 'high' ? 12 : 8, LAMP_SLOTS = Settings.quality === 'low' ? 2 : Settings.quality === 'high' ? 5 : 4;
const lightPool = [];
for (let i = 0; i < LIGHT_POOL; i++) { const l = new THREE.PointLight(0xffffff, 0, 10, 1.6); l.userData = { life: 0, max: 0, base: 0, owner: null }; scene.add(l); lightPool.push(l); }
function flashLight(pos, color, intensity, dist, life) {
  let best = null;
  for (let i = LAMP_SLOTS; i < LIGHT_POOL; i++) { const l = lightPool[i]; if (!l.userData.owner && (!best || l.userData.life < best.userData.life)) best = l; }
  if (!best) return;
  best.position.copy(pos); best.color.set(color); best.distance = dist; best.userData.base = intensity; best.intensity = intensity; best.userData.life = life; best.userData.max = life;
}
const ownedLights = []; // {obj, color, intensity, dist} lights attached to props (light tool)
function updateLights(dt) {
  for (let i = LAMP_SLOTS; i < LIGHT_POOL; i++) {
    const l = lightPool[i];
    if (l.userData.owner) continue;
    if (l.userData.life > 0) { l.userData.life -= dt; l.intensity = l.userData.base * Math.max(0, l.userData.life / l.userData.max); } else l.intensity = 0;
  }
}
let lampTimer = 0;
function assignLamps(dt) {
  lampTimer -= dt; if (lampTimer > 0) return; lampTimer = 0.35;
  const p = camera.getWorldPosition(_v1);
  const cands = World.lamps.concat(ownedLights.filter(o => o.obj.parent));
  cands.forEach(c => { c._d = (c.obj ? c.obj.getWorldPosition(_v2) : c.pos).distanceToSquared(p); });
  cands.sort((a, b) => a._d - b._d);
  for (let i = 0; i < LAMP_SLOTS; i++) {
    const l = lightPool[i], c = cands[i];
    if (c && c._d < 120 * 120) {
      if (c.obj) c.obj.getWorldPosition(l.position); else l.position.copy(c.pos);
      l.color.set(c.color); l.intensity = c.flicker ? c.intensity * (Math.random() < 0.06 ? 0.1 : 1) : c.intensity; l.distance = c.dist;
    } else l.intensity = 0;
  }
}

// ---------------- sky ----------------
const skyMat = new THREE.ShaderMaterial({
  uniforms: { top: { value: new THREE.Color(0x3f7fd9) }, horizon: { value: new THREE.Color(0xbfd8f0) }, bottom: { value: new THREE.Color(0x6b6a60) }, sunDir: { value: sunDir }, sunCol: { value: new THREE.Color(0xfff2d0) }, stars: { value: 0 }, sunSize: { value: 1 }, time: { value: 0 }, clouds: { value: 0.5 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_Position.z = gl_Position.w*0.99999; }`,
  fragmentShader: `uniform vec3 top,horizon,bottom,sunDir,sunCol; uniform float stars,sunSize,time,clouds; varying vec3 vDir;
  float hash(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
  float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n2(p);p*=2.03;a*=.5;}return v;}
  void main(){ vec3 d=normalize(vDir); float h=d.y;
    vec3 col = h>0. ? mix(horizon, top, pow(clamp(h,0.,1.),0.55)) : mix(horizon,bottom,pow(clamp(-h,0.,1.),0.4));
    float s=max(dot(d,normalize(sunDir)),0.);
    col += sunCol*(pow(s,900.0/sunSize)*3.0 + pow(s,12.)*0.22);
    if(stars>0.){ vec3 p=floor(d*500.); float st=step(0.9982,hash(p)); col+=vec3(st)*stars*smoothstep(0.,0.15,h);}

defineMod({
  id: 'gizmos', name: 'Gizmos & Gadgets', icon: '⚙', defaultOn: true, author: 'BOXMOD original', category: 'Props',
  desc: 'Interactive gadgets for contraptions: Trampoline, Launch Pad, Speed Pad, linked Teleporters, Fan, Magnet and an Anti-Gravity Field.',
  content() {
    const onPad = (e, t, pad = .6) => { const p = e.mesh.position; const tp = t.isPlayer || t.isNPC ? t.pos : t.mesh.position; return Math.abs(tp.x - p.x) < e.ext.x + .2 && Math.abs(tp.z - p.z) < e.ext.z + .2 && tp.y - (t.isPlayer || t.isNPC ? 0 : t.ext.y) > p.y && tp.y - (t.isPlayer || t.isNPC ? 0 : t.ext.y) < p.y + e.ext.y + pad; };
    const bodies = (e) => [Player, ...World.npcs.filter(n => n.alive), ...World.ents.filter(x => x !== e && !x.frozen && !x.noPhys)];
    const velOf = t => t.vel;
    def('ents', 'trampoline', { name: 'Trampoline', cat: 'Gizmos', icon: '🤸', build: () => groupProp(g => { cyl(g, 1.5, 1.5, .1, cmat(0x1a1a1a, .9), 0, .1, 0, 0, 0, 0, 24); const r = mesh(new THREE.TorusGeometry(1.5, .06, 6, 32), cmat(0x2a6ad8, .4, .3)); r.rotation.x = Math.PI / 2; r.position.y = .12; g.add(r); for (let i = 0; i < 6; i++) { const a = i / 6 * 6.28; cyl(g, .04, .04, .4, MAT.metal, Math.cos(a) * 1.4, -.12, Math.sin(a) * 1.4); } }, V3(1.3, .3, 1.3), 40, 'metal'), onSpawn(e) { e.think = (e) => { for (const t of bodies(e)) if (onPad(e, t, .5) && (velOf(t).y < -1 || (t.isPlayer && keys.Space))) { velOf(t).y = Math.max(16, -velOf(t).y * 1.05); if (t.isPlayer || t.isNPC) t.onGround = false; sfx.squeak(e.mesh.position); } }; } });
    def('ents', 'launchpad', { faceAway: true, name: 'Launch Pad', cat: 'Gizmos', icon: '🚀', build: () => groupProp(g => { bx(g, 2, .15, 2, cmat(0x333, .5, .6)); bx(g, 1.6, .16, 1.6, emat(0xff8a20, 1.2)); cone(g, .4, .3, emat(0xffffff, 1), 0, .1, 0, 0, 0, 0, 3); }, V3(1, .08, 1), 60, 'metal'), onSpawn(e) { e.think = (e) => { for (const t of bodies(e)) if (onPad(e, t)) { const f = V3(Math.sin(e.mesh.rotation.y), 0, Math.cos(e.mesh.rotation.y)).multiplyScalar(10); velOf(t).set(f.x, 24, f.z); if (t.isPlayer || t.isNPC) t.onGround = false; sfx.boom(e.mesh.position, .2); burst(e.mesh.position, 20, 0xff8a20, 4, .2, .5, 0, true); } }; } });
    def('ents', 'speedpad', { faceAway: true, name: 'Speed Pad', cat: 'Gizmos', icon: '⏩', build: () => groupProp(g => { bx(g, 2, .08, 3, cmat(0x222, .5)); for (let i = 0; i < 3; i++) cone(g, .5, .6, emat(0x30ff80, 1.5), 0, .05, -.8 + i * .8, Math.PI / 2, 0, 0, 3); }, V3(1, .05, 1.5), 40, 'metal'), onSpawn(e) { e.think = (e) => { const f = V3(0, 0, 1).applyQuaternion(e.mesh.quaternion).setY(0).normalize().multiplyScalar(30); for (const t of bodies(e)) if (onPad(e, t, .4)) { velOf(t).x = f.x; velOf(t).z = f.z; } }; } });
    let pending = null;
    def('ents', 'teleporter', { name: 'Teleporter (spawn 2)', cat: 'Gizmos', icon: '🌀', build: () => groupProp(g => { cyl(g, .9, .9, .12, cmat(0x333, .5, .6), 0, 0, 0, 0, 0, 0, 20); cyl(g, .75, .75, .13, emat(0xa040ff, 1.5), 0, 0, 0, 0, 0, 0, 20); }, V3(.8, .07, .8), 40, 'metal'), onSpawn(e) { if (pending && pending.alive) { e.partner = pending; pending.partner = e; pending = null; notify('Teleporters linked!'); } else { pending = e; notify('Spawn a second teleporter to link them'); } e.think = (e, dt) => { e.cd = (e.cd || 0) - dt; if (Math.random() < .3) spawnParticle(e.mesh.position.clone().add(V3(rand(-.6, .6), .1, rand(-.6, .6))), _v2.set(0, 2, 0), 0xc080ff, .1, .6, -0.1, true); if (!e.partner || !e.partner.alive || e.cd > 0) return; for (const t of bodies(e)) if (onPad(e, t, 1.8)) { const q = e.partner.mesh.position; if (t.isPlayer || t.isNPC) t.pos.set(q.x, q.y + .2, q.z); else t.mesh.position.set(q.x, q.y + t.ext.y + .3, q.z); e.cd = e.partner.cd = 1.2; sfx.zap(q); flashLight(q, 0xa040ff, 10, 8, .2); } }; } });
    def('ents', 'fan', { faceAway: true, name: 'Industrial Fan', cat: 'Gizmos', icon: '🌬', build: () => groupProp(g => { const r = mesh(new THREE.TorusGeometry(.8, .08, 6, 24), cmat(0x666, .5, .7)); g.add(r); const bl = pivot(g, 0, 0, 0); for (let i = 0; i < 4; i++) bx(bl, .25, .7, .02, cmat(0xaaaaaa, .4, .6), 0, 0, 0, 0, .3, i * 1.57).translateY(.35); g.userData.blades = bl; bx(g, .3, 1, .3, cmat(0x444, .5, .6), 0, -.9, -.1); }, V3(.85, .85, .2), 40, 'metal', { faceAway: true }), onSpawn(e) { e.think = (e, dt) => { e.mesh.userData.blades.rotation.z += dt * 25; const f = V3(0, 0, 1).applyQuaternion(e.mesh.quaternion); for (const t of bodies(e)) { const tp = t.isPlayer || t.isNPC ? t.pos.clone().setY(t.pos.y + 1) : t.mesh.position; const to = tp.clone().sub(e.mesh.position); const d = to.length(); if (d < 14 && to.normalize().dot(f) > .8) velOf(t).addScaledVector(f, (14 - d) * 3 * dt * (t.mass ? Math.min(2, 30 / t.mass) : 1)); } if (Math.random() < .3) spawnParticle(e.mesh.position.clone().addScaledVector(f, .3), f.clone().multiplyScalar(10).add(_v2.set(rand(-1, 1), rand(-1, 1), rand(-1, 1))), 0xffffff, .05, .5, 0, true); }; } });
    def('ents', 'magnet', { name: 'Magnet', cat: 'Gizmos', icon: '🧲', build: () => groupProp(g => { const t = mesh(new THREE.TorusGeometry(.4, .14, 8, 16, Math.PI), cmat(0xd02020, .4, .5)); t.rotation.z = Math.PI; g.add(t); for (const s of [-1, 1]) bx(g, .28, .2, .28, MAT.metal, s * .4, -.05, 0); }, V3(.55, .4, .15), 30, 'metal'), onSpawn(e) { e.think = (e, dt) => { for (const x of World.ents) { if (x === e || x.sound !== 'metal' || x.frozen || x.held || x.noPhys) continue; const to = e.mesh.position.clone().sub(x.mesh.position); const d = to.length(); if (d < 14 && d > .8) x.vel.addScaledVector(to.normalize(), 120 / (d * d + 1) * dt * 4); } }; } });
    def('ents', 'antigrav', { name: 'Anti-Gravity Field', cat: 'Gizmos', icon: '🫧', build: () => groupProp(g => { cyl(g, .4, .5, .3, cmat(0x222, .5, .6)); sph(g, .25, emat(0x80c0ff, 1.5), 0, .3, 0); }, V3(.5, .3, .5), 30, 'metal'), onSpawn(e) { const bub = mesh(new THREE.SphereGeometry(8, 24, 16), new THREE.MeshBasicMaterial({ color: 0x80c0ff, transparent: true, opacity: .07, depthWrite: false })); bub.raycast = () => { }; World.group.add(bub); e.onRemove = () => bub.parent && bub.parent.remove(bub); e.think = (e, dt) => { bub.position.copy(e.mesh.position); for (const t of bodies(e)) { const tp = t.isPlayer || t.isNPC ? t.pos : t.mesh.position; if (t === e || tp.distanceTo(e.mesh.position) > 8) continue; velOf(t).y += World.gravity * 1.08 * dt; velOf(t).multiplyScalar(1 - .5 * dt); if (t.isPlayer || t.isNPC) t.onGround = false; } }; } });
  }
});

const thumbCache = {}, thumbQueue = [];
function thumbFor(kind, d) {
  const key = kind + ':' + d.id;
  if (thumbCache[key]) return thumbCache[key];

function processThumbs(n = 3) {

      thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); thumbR.setSize(96, 96); thumbR.outputColorSpace = THREE.SRGBColorSpace; thumbR.toneMapping = THREE.ACESFilmicToneMapping;

    for (let i = 0; i < n && thumbQueue.length; i++) {
      const q = thumbQueue.shift(); let obj;
      if (q.kind === 'props' || q.kind === 'ents') obj = q.d.build({}).mesh; else obj = q.d.build({});
      if (q.d.id === 'scp966' || q.d.id === 'visitor') { }
      thumbScene.add(obj); obj.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(obj); const c = box.getCenter(V3()), s = box.getSize(V3()); const m = Math.max(s.x, s.y, s.z) || 1;
      thumbCam.position.copy(c).add(V3(.9, .55, 1.3).normalize().multiplyScalar(m * 1.9)); thumbCam.lookAt(c); thumbCam.near = m * .05; thumbCam.far = m * 10; thumbCam.updateProjectionMatrix();
      obj.visible = true; obj.traverse(o => o.visible = true);
      thumbR.render(thumbScene, thumbCam);
      thumbCache[q.key] = thumbR.domElement.toDataURL();
      thumbScene.remove(obj); obj.traverse(o => { if (o.geometry && !o.isInstancedMesh) o.geometry.dispose(); });
      document.querySelectorAll(`img[data-thumb="${q.key}"]`).forEach(img => { img.src = thumbCache[q.key]; img.style.display = ''; const em = img.nextElementSibling; if (em) em.style.display = 'none'; });
    }
  } catch (e) { thumbQueue.length = 0; }
}

    on('opVol', 'input', t => { Settings.volume = +t.value; if (master) master.gain.value = Settings.volume; });
    on('opNpc', 'input', t => { Settings.npcLimit = +t.value; $('opNpcV').textContent = t.value; });
    on('opProp', 'input', t => { Settings.propLimit = +t.value; $('opPropV').textContent = t.value; });
    on('opCorpse', 'input', t => { Settings.corpseTime = +t.value; $('opCorpseV').textContent = t.value; });
    on('opAmmo', 'change', t => Settings.infiniteAmmo = t.checked); on('opGore', 'change', t => Settings.gore = t.checked); on('opBob', 'change', t => Settings.viewbob = t.checked); on('opSub', 'change', t => Settings.subtitles = t.checked);
  }, 0);

}
const CONTROLS = [['WASD', 'Move'], ['Mouse', 'Look'], ['Space', 'Jump / swim up'], ['Shift', 'Sprint'], ['Ctrl / C', 'Crouch'], ['Q', 'Spawn menu (props, NPCs, weapons, tools, maps, mods)'], ['Z', 'Undo last spawn'], ['V', 'Toggle noclip'], ['F', 'Flashlight'], ['E', 'Use / enter vehicle / make ally follow'], ['1–6, wheel', 'Switch weapon'], ['LMB / RMB', 'Primary / secondary fire'], ['R', 'Reload · physgun: unfreeze · toolgun: tool option'], ['Physgun', 'Hold LMB to grab, wheel to push/pull, E+mouse to rotate (Shift snaps), RMB to freeze'], ['G', 'Fire thrusters'], ['N', 'Night vision (SCP mod)'], ['B', 'Hold to delay blinking (SCP-173)'], ['T', 'Bullet time (mod)'], ['H', 'Third person (mod)'], ['X', 'Force push / ground slam (Superpowers mod)'], ['Esc', 'Pause']];
function controlsHTML() { return '<table class="ctrls">' + CONTROLS.map(([k, v]) => `<tr><td><kbd>${k}</kbd></td><td>${v}</td></tr>`).join('') + '</table>'; }
function creditsHTML() { return '<p><b>BOXMOD</b> — a physics sandbox built with <b>three.js</b> (MIT licence). All models, textures and sounds are generated procedurally in code.</p><p>Inspired by classic physics sandbox games. All maps, NPCs and the Cryptid / Analog Horror creatures are original designs.</p><h3>Mod credits</h3>' + MODS.filter(m => m.credit).map(m => `<div class="lore"><b>${m.icon} ${esc(m.name)}</b><br>${esc(m.credit)}</div>`).join(''); }

// ---------------- main menu ----------------
function showMainMenu() {
  Game.state = 'menu'; if (document.pointerLockElement) document.exitPointerLock();
  ['hud', 'pause', 'spawnmenu', 'clickplay', 'deathscreen'].forEach(id => $(id).classList.add('hidden'));
  $('mainmenu').classList.remove('hidden'); $('mmResume').style.display = Game.started ? '' : 'none';
  vmRoot.visible = false;
}
function mmPanel(title, node) { $('mmTitle').textContent = title; const b = $('mmBody'); b.innerHTML = ''; if (typeof node === 'string') b.innerHTML = node; else b.appendChild(node); $('mmPanel').classList.remove('hidden'); }
$('mmClose').onclick = () => $('mmPanel').classList.add('hidden');
document.querySelectorAll('#mainmenu .mmbtn').forEach(el => el.onclick = () => {
  initAudio(); sfx.click();
  const a = el.dataset.act;
  if (a === 'play') mmPanel('Choose a map', mapList(() => startGame()));

  if (a === 'mods') { const re = () => mmPanel('Mods', modManager(re)); re(); }

  if (a === 'controls') mmPanel('Controls', controlsHTML());
  if (a === 'credits') mmPanel('Credits', creditsHTML());
});
function startGame(resume) {
  $('mmPanel').classList.add('hidden'); $('mainmenu').classList.add('hidden'); $('hud').classList.remove('hidden');
  Game.state = 'play'; Game.started = true; vmRoot.visible = !Player.vehicle;
  if (!resume) { Player.weapons.length || giveLoadout(); selectWeapon(Player.cur); }
  lockPointer();
  if (!resume) { centerMsg(World.map.name, 2.5); notify('Press Q for the spawn menu · Esc to pause', '#4ea6ff'); }
}
function giveLoadout() { ['physgun', 'gravgun', 'crowbar', 'pistol', 'magnum', 'smg', 'rifle', 'shotgun', 'crossbow', 'rpg', 'grenade', 'medkit', 'toolgun', 'camera'].forEach(id => giveWeapon(id, false)); Player.cur = Math.max(0, Player.weapons.indexOf('physgun')); }
// pause
Game.onLockChange = (locked) => {
  if (locked) { $('clickplay').classList.add('hidden'); $('pause').classList.add('hidden'); return; }
  if (Game.state === 'play') { Game.state = 'paused'; $('pause').classList.remove('hidden'); }
};
document.querySelectorAll('#pause .btn').forEach(b => b.onclick = () => {
  const p = b.dataset.p; sfx.click();
  if (p === 'resume') { $('pause').classList.add('hidden'); Game.state = 'play'; lockPointer(); }
  if (p === 'spawn') { $('pause').classList.add('hidden'); openSpawnMenu(); }
  if (p === 'save') saveWorld(); if (p === 'load') loadWorld(); if (p === 'cleanup') cleanupMap();
  if (p === 'menu') { $('pause').classList.add('hidden'); showMainMenu(); }
});
$('clickplay').onclick = () => { lockPointer(); };
// save / load
function saveWorld() {
  const data = { map: World.map.id, player: [Player.pos.x, Player.pos.y, Player.pos.z, Player.yaw], ents: [], npcs: [] };
  World.ents.forEach(e => { if (!e.spec || !e.spec.id || e.mapProp) return; const p = e.mesh.position, q = e.mesh.quaternion; data.ents.push([e.spec.id, p.x, p.y, p.z, q.x, q.y, q.z, q.w, e.mesh.scale.x, e.frozen ? 1 : 0, e.spec.color || 0]); });
  World.npcs.forEach(n => { if (n.alive && !n.def.hidden) data.npcs.push([n.def.id, n.pos.x, n.pos.y, n.pos.z, n.yaw]); });
  saveLS('boxmod_save', data); notify('World saved (' + data.ents.length + ' props, ' + data.npcs.length + ' NPCs)', '#5c5');
}
function loadWorld() {
  let d; try { d = JSON.parse(localStorage.getItem('boxmod_save')); } catch (e) { }
  if (!d) { notify('No saved world found', '#e55'); return; }
  loadMap(d.map);
  d.ents.forEach(a => { const e = spawnProp(a[0], V3(a[1], a[2], a[3]), { quat: new THREE.Quaternion(a[4], a[5], a[6], a[7]), scale: a[8], force: true }); if (e) { e.frozen = !!a[9]; if (a[10]) forMeshes(e.mesh, o => { o.material = o.material.clone(); o.material.color.set(a[10]); }); } });
  d.npcs.forEach(a => spawnNPC(a[0], V3(a[1], a[2], a[3]), { yaw: a[4], force: true }));
  Player.pos.set(d.player[0], d.player[1], d.player[2]); Player.yaw = d.player[3];
  $('pause').classList.add('hidden'); Game.state = 'play'; lockPointer(); notify('World loaded', '#5c5');
}

// ---------------- input bindings ----------------
keyHandlers.push((code, e) => {
  if (!Player.alive && Game.state === 'play' && Player.deadT > 1) { respawnPlayer(); return; }
  if (code === 'KeyQ' && (Game.state === 'play' || Game.state === 'spawnmenu')) { Game.state === 'spawnmenu' ? closeSpawnMenu() : openSpawnMenu(); return; }
  if (Game.state !== 'play') return;
  Hooks.run('key', code);
  if (code === 'KeyZ') undo();
  if (code === 'KeyV' && !Player.vehicle) { Player.noclip = !Player.noclip; Player.vel.set(0, 0, 0); notify('Noclip ' + (Player.noclip ? 'ON' : 'OFF')); }
  if (code === 'KeyF') { Player.flashlight = !Player.flashlight; sfx.click(); }
  if (code.startsWith('Digit')) { const n = +code.slice(5); if (n >= 1 && n <= 6) slotKey(n); }
  if (code === 'KeyR') { const w = curWeapon(); if (w && w.clip) startReload(w, wstate(w.id)); }
  if (code === 'KeyE') useKey();
});
renderer.domElement.addEventListener('mousedown', () => { if (!Player.alive && Game.state === 'play' && Player.deadT > 1) respawnPlayer(); });
function useKey() {
  if (Player.vehicle) { exitVehicle(); return; }
  if (Phys.ent) return;
  const h = trace(eyePos(V3()), viewDir(V3()), 3.2, Player);
  if (!h || !h.target) return;
  const t = h.target;
  if (t.isVehicle) enterVehicle(t);
  else if (t.isNPC && t.faction === 'ally' && !t.def.scp) { t.follow = !t.follow; subtitle(`<b>${t.name}:</b> ${t.follow ? pick(['Right behind you.', 'Lead the way.', 'Okay, let\'s go.']) : pick(['I\'ll wait here.', 'Holding position.', 'Okay, I\'ll stay.'])}`, '#9cf', 2); sfx.voice(t.pos); }
}
function hintFor() {
  if (Player.vehicle) return 'Press E to exit the ' + Player.vehicle.name;
  const h = trace(eyePos(V3()), viewDir(V3()), 3.2, Player);
  if (!h || !h.target) return '';
  const t = h.target;
  if (t.isVehicle) return 'Press E to drive the ' + t.name;
  if (t.isNPC && t.faction === 'ally' && !t.def.scp) return `Press E to make ${t.name} ${t.follow ? 'stay' : 'follow you'}`;
  if (t.hint) return t.hint;
  return '';
}

// ---------------- third-person body ----------------
let tpBody = null;
function updateTPBody(dt, show) {
  if (!show) { if (tpBody) tpBody.visible = false; return; }
  if (!tpBody) { tpBody = makeHumanoid({ skin: 0xc9a07a, hair: 0x3a2414, shirt: 0xd87a2a, pants: 0x2a3a4a, weapon: 'short' }); scene.add(tpBody); tpBody.userData.anim = 0; }
  tpBody.visible = true; tpBody.position.copy(Player.pos); tpBody.rotation.y = Player.yaw + Math.PI;
  const P = tpBody.userData.parts, sp = Math.hypot(Player.vel.x, Player.vel.z); tpBody.userData.anim += dt * (2 + sp * 2); const s = Math.sin(tpBody.userData.anim) * Math.min(1, sp / 5) * .7;
  P.legL.rotation.x = s; P.legR.rotation.x = -s; P.armL.rotation.x = -s; P.armR.rotation.x = -1.4 + Player.pitch * -1; P.head.rotation.x = -Player.pitch * .5;
  tpBody.scale.y = Player.crouch ? .6 : 1;
}

// ---------------- HUD ----------------
let hudT = 0;
function updateHUD(dt) {
  hudT -= dt;
  if (centerTimer > 0) { centerTimer -= dt; $('centerMsg').style.opacity = Math.min(1, centerTimer); } else $('centerMsg').textContent = '';
  if (slotsT > 0) { slotsT -= dt; if (slotsT <= 0) $('wslots').classList.add('hidden'); }
  // fx overlays
  FX.damage = Math.max(0, FX.damage - dt * 1.2); FX.flash = Math.max(0, FX.flash - dt * 1.5); FX.vhs = Math.max(0, FX.vhs - dt * .6); FX.shake = Math.max(0, FX.shake - dt * 2); if (FX.eas > 0) FX.eas -= dt;
  if (Player.blinking <= 0 && !Player.inPocket) FX.black = Math.max(0, FX.black - dt * 1.5);
  $('fx-damage').style.opacity = FX.damage; $('fx-flash').style.opacity = FX.flash; $('fx-black').style.opacity = Math.min(1, FX.black);
  $('fx-vhs').style.opacity = Math.min(1, FX.vhs); $('fx-nv').style.opacity = Player.nightvision ? 1 : 0;
  $('fx-eas').style.opacity = FX.eas > 0 ? 1 : 0; if (FX.eas > 0) $('fx-eas').style.textIndent = (-((12 - FX.eas) * 120) % 3000) + 'px';
  if (FX.vhs > .05) { const d = new Date(); $('fx-vhs').dataset.t = 'SP ' + d.toTimeString().slice(0, 8); renderer.domElement.style.filter = `contrast(${1 + FX.vhs * .3}) saturate(${1 - FX.vhs * .6}) blur(${FX.vhs * .8}px) hue-rotate(${Math.sin(World.time * 20) * FX.vhs * 10}deg)`; }
  else if (Player.nightvision) renderer.domElement.style.filter = 'brightness(2.6) saturate(0) contrast(1.2)';
  else renderer.domElement.style.filter = '';
  if (Game.state === 'menu') return;
  if (hudT > 0) return; hudT = 0.1;
  $('hpv').textContent = Math.max(0, Math.ceil(Player.hp)); $('hpbox').classList.toggle('low', Player.hp < 26);
  $('armorbox').classList.toggle('hidden', Player.armor <= 0); $('arv').textContent = Math.ceil(Player.armor);
  const w = curWeapon();
  $('wname').textContent = w ? w.name : '';
  if (w && (w.ammo || w.clip)) { $('ammobox').classList.remove('hidden'); const st = wstate(w.id); $('clipv').textContent = w.clip ? st.clip : (Settings.infiniteAmmo ? '∞' : Player.ammo[w.ammo] || 0); $('resv').textContent = w.clip ? (Settings.infiniteAmmo ? '∞' : (Player.ammo[w.ammo] || 0)) : ''; } else $('ammobox').classList.add('hidden');
  $('hint').textContent = Game.state === 'play' && Player.alive ? hintFor() : '';
  if (!w || w.id !== 'toolgun') $('toolinfo').classList.add('hidden');
  $('crosshair').style.display = Player.vehicle || (camera.fov < 30) ? 'none' : '';
}

// ---------------- main loop ----------------
let menuOrbit = 0;
function updateEntThinks(dt) {
  for (const e of World.ents.slice()) {
    if (!e.alive) continue;
    if (e.think) e.think(e, dt);
    if (e.life > 0) { e.life -= dt; if (e.life <= 0) { if (e.isCorpse || e.isGib) { e.fadeT = 1; } else { removeEnt(e); continue; } } }
    if (e.fadeT > 0) { e.fadeT -= dt; e.mesh.scale.multiplyScalar(0.96); if (e.fadeT <= 0) removeEnt(e); }
  }
}
function updateCamera(dt) {
  const P = Player;
  if (Game.state === 'menu') {
    menuOrbit += dt * .05; const c = World.map.spawn || V3();
    camera.position.set(c.x + Math.sin(menuOrbit) * 30, groundAt(c.x, c.z) + 9, c.z + Math.cos(menuOrbit) * 30);
    camera.lookAt(c.x, groundAt(c.x, c.z) + 3, c.z); P.yaw = camera.rotation.y; return;
  }
  if (!P.alive) { P.deadT += dt; camera.position.set(P.pos.x, lerp(camera.position.y, P.pos.y + .3, Math.min(1, 3 * dt)), P.pos.z); camera.rotation.set(P.pitch, P.yaw, Math.min(1.2, P.deadT * 2)); return; }
  camera.rotation.set(P.pitch, P.yaw, 0);
  const fwd = V3(-Math.sin(P.yaw) * Math.cos(P.pitch), Math.sin(P.pitch), -Math.cos(P.yaw) * Math.cos(P.pitch));
  if (P.vehicle) {
    const v = P.vehicle; const tgt = v.pos.clone().setY(v.pos.y + v.half.y * 2 + .6); const dist = Math.max(6, v.half.z * 3);
    const cp = tgt.clone().addScaledVector(fwd, -dist); const gy = groundAt(cp.x, cp.z, cp.y) + .5; if (cp.y < gy) cp.y = gy;
    camera.position.lerp(cp, Math.min(1, 12 * dt));
  } else if (P.thirdPerson) {
    const head = eyePos(V3()); const right = V3(Math.cos(P.yaw), 0, -Math.sin(P.yaw)); let cp = head.clone().addScaledVector(fwd, -3.2).addScaledVector(right, .7);
    for (let k = 0; k < 6 && lineBlocked(head, cp); k++) cp.lerp(head, .3);
    camera.position.copy(cp);
  } else {
    camera.position.copy(eyePos(V3()));
    if (Settings.viewbob && P.onGround) { const sp = Math.hypot(P.vel.x, P.vel.z); camera.position.y += Math.sin(VM.bob * 2) * .025 * Math.min(1, sp / 6); }
  }
  if (FX.shake > 0) { const s = FX.shake * .15; camera.position.add(V3(rand(-s, s), rand(-s, s), rand(-s, s))); camera.rotation.z += rand(-s, s) * .3; }
}
function frame() {
  requestAnimationFrame(frame);
  const rdt = Math.min(clock.getDelta(), 0.05);
  const dt = rdt * World.timeScale;
  try {
    World.time += dt;
    const sim = Game.state === 'play' || Game.state === 'spawnmenu' || Game.state === 'paused' && false;
    if (sim) {
      if (Player.alive) {
        if (pointerLocked && Game.state === 'play' && !Phys.rotating) { const k = 0.0022 * Settings.sens * (camera.fov / Settings.fov); Player.yaw -= mouse.dx * k; Player.pitch = clamp(Player.pitch - mouse.dy * k, -1.55, 1.55); }
        if (!Player.vehicle) { Player.lastPos.copy(Player.pos); updatePlayerMove(Math.max(dt, rdt * .6)); }
        if (!Player.vehicle) weaponTick(rdt);
        if (Player.noise > .3 && (Player._nt = (Player._nt || 0) - dt) <= 0) { Player._nt = .5; makeNoise(Player.pos, Player.noise, Player); }
        if (Player.hp < Player.maxHp && World.time - Player.lastHurt > 10 && Player.armor >= 0) Player.hp = Math.min(Player.maxHp, Player.hp + dt * .5);
      }
      const steps = dt > 1 / 50 ? 2 : 1;
      for (let i = 0; i < steps; i++) physicsStep(dt / steps);
      updateEntThinks(dt); updateBalloons(dt); updateThrustersEmitters(dt);
      updateNPCs(dt); updateVehicles(dt); updateProjectiles(dt); updateTimed(dt);
      Hooks.run('tick', dt);
    }
    if (Game.state === 'spawnmenu') processThumbs(3);
    if (Game.state === 'menu' && $('mmPanel').classList.contains('hidden') === false) processThumbs(1);
    updateCamera(rdt);
    updateTPBody(rdt, Player.thirdPerson && !Player.vehicle && Player.alive && Game.state !== 'menu');
    vmRoot.visible = Game.state !== 'menu' && Player.alive && !Player.vehicle && !Player.thirdPerson && camera.fov >= 30;
    if (vmRoot.visible) updateViewmodel(rdt);
    flashlight.intensity = Player.flashlight && Game.state !== 'menu' ? 40 : 0;
    skyMesh.position.copy(camera.position); skyMat.uniforms.time.value = World.time;
    sun.position.copy(camera.position).addScaledVector(sunDir, 160); sun.target.position.copy(camera.position); sun.target.updateMatrixWorld();
    if (World.waterMesh && MAT.water.normalMap) { MAT.water.normalMap.offset.x += rdt * .02; MAT.water.normalMap.offset.y += rdt * .013; }
    updateParticles(rdt); updateFxLines(rdt); updateLights(rdt); assignLamps(rdt);
    updateFrustum();
    updateHUD(rdt);
    renderer.autoClear = true; renderer.render(scene, camera);
    if (vmRoot.visible && vmModel) { renderer.autoClear = false; renderer.clearDepth(); vmCam.fov = 62; renderer.render(vmScene, vmCam); }
    if (Game.screenshot) { Game.screenshot = false; try { const a = document.createElement('a'); a.href = renderer.domElement.toDataURL('image/png'); a.download = 'boxmod_' + Date.now() + '.png'; a.click(); FX.flash = .5; sfx.click(); notify('Screenshot saved'); } catch (e) { } }
  } catch (e) { console.error(e); }
  mouse.dx = mouse.dy = 0; if (!Phys.ent) { if (mouse.wheel && Game.state === 'play' && Player.weapons.length && !Player.vehicle) { const n = Player.weapons.length; selectWeapon(((Player.cur + Math.sign(mouse.wheel)) % n + n) % n); } } mouse.wheel = 0;
  if (Game.state === 'play' && !pointerLocked && Player.alive) $('clickplay').classList.remove('hidden'); else $('clickplay').classList.add('hidden');
}

// ---------------- init ----------------
function init() {
  buildTextures(); buildMaterials();
  PS_N = makeParticleSystem(false); PS_A = makeParticleSystem(true);
  defBaseMaps(); defProps(); defEnts(); defBaseNPCs(); defBaseVehicles(); defBaseWeapons(); defTools();
  loadModContent(); saveLS('boxmod_mods', ModState);
  startMods();
  applyQuality();
  giveLoadout();
  let last = null; try { last = JSON.parse(localStorage.getItem('boxmod_lastmap')); } catch (e) { }
  loadMap(last && Reg.maps[last.id] && modOn(Reg.maps[last.id].mod) ? last.id : 'gm_buildyard');
  $('loading').classList.add('hidden');
  showMainMenu();
  frame();

init();
